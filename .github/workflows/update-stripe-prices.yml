name: Sync Stripe Catalog

on:
  schedule:
    - cron: '0 */2 * * *' # Executing every 2 hours
  workflow_dispatch:

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch Raw Stripe Data
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          curl -s -u "${STRIPE_SECRET_KEY}:" \
            -G "https://api.stripe.com/v1/prices" \
            -d "active=true" \
            -d "expand[]=data.product" \
            -o stripe_catalog.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add stripe_catalog.json
          git commit -m "chore(store): sync raw stripe data" || exit 0
          git push origin main