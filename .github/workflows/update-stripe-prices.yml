name: Sync Stripe Catalog

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *' # Executing every 2 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Raw Stripe Data
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          curl -s -u "${STRIPE_SECRET_KEY}:" \
            -G "https://api.stripe.com/v1/prices" \
            -d "active=true" \
            -d "expand[]=data.product" \
            -o stripe_catalog.json

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Move the generated catalog to a temporary location
          mv stripe_catalog.json /tmp/stripe_catalog.json

          # Fetch the existing 'data' branch to ensure we have the latest changes
          git fetch origin data
          git checkout data || git checkout --orphan data

          # Move the generated catalog to the root of the repository
          mv /tmp/stripe_catalog.json .

          # Stage the catalog file
          git add stripe_catalog.json

          # Commit changes if there are any, otherwise exit without error
          git commit -m "Update Stripe data" || exit 0

          # Push the changes to the 'data' branch, retrying if it changed remotely
          for attempt in 1 2 3; do
            if git push origin HEAD:data; then
              exit 0
            fi

            git fetch origin data
            git rebase origin/data
          done

          exit 1