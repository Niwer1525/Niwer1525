name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *' # Execute every 2 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: node build.js
        env:
          NODE_ENV: production
          API_BASE_URL: https://panel.niwer.dev
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          WAKATIME_SECRET_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_SECRET_KEY: ${{ secrets.STATS_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # The SSG output directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4